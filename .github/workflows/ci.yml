name: CI

# ---------------------------------------------------------------------------
# BRANCH POLICY (see GITHUB_ACTIONS.md at the repository root)
#
# This workflow runs ONLY for:
#   1. pushes to `main`
#   2. tags matching `v*` whose tagged commit is contained in `main`
#
# Pushes to any other branch never start a run. The `gate` job below
# re-verifies the ref inside the run, so a tag created from a feature branch
# fails fast instead of building or publishing.
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  DEFAULT_NODE_VERSION: '20'

jobs:
  # 1. Enforce the branch policy before any other job is allowed to run.
  gate:
    name: Verify ref is main (or a tag from main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is required to test whether a tagged commit is an
          # ancestor of main.
          fetch-depth: 0

      - name: Verify the ref is allowed
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::This workflow only runs on the 'main' branch. Requested branch: '$GITHUB_REF_NAME'. See GITHUB_ACTIONS.md."
              exit 1
            fi
            echo "Allowed: push to main ($GITHUB_SHA)."
            exit 0
          fi

          # Tag push: the tagged commit must be reachable from main.
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

          # Resolve the tag to its commit (works for annotated and lightweight tags).
          if ! TAGGED_COMMIT="$(git rev-parse "${GITHUB_REF}^{commit}" 2>/dev/null)"; then
            git fetch --no-tags origin "+${GITHUB_REF}:${GITHUB_REF}"
            TAGGED_COMMIT="$(git rev-parse "${GITHUB_REF}^{commit}")"
          fi

          echo "Tag ${GITHUB_REF_NAME} points at commit ${TAGGED_COMMIT}."

          if ! git merge-base --is-ancestor "$TAGGED_COMMIT" refs/remotes/origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} was not created from the 'main' branch. Create release tags from main. See GITHUB_ACTIONS.md."
            exit 1
          fi

          echo "Allowed: tag ${GITHUB_REF_NAME} is contained in main."

  # 2. Install dependencies once and warm the pnpm cache for the other jobs.
  install:
    name: Install dependencies
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report installed toolchain
        run: |
          node --version
          pnpm --version
          pnpm list --depth=0

  # 3. Formatting and linting with Biome (formatter + linter in one tool).
  format:
    name: Format check (Biome)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

  lint:
    name: Lint (Biome)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint sources and tests
        run: pnpm run lint

      - name: Biome CI report
        run: pnpm run check:ci

  # 4. Type checking for the library and for the test suite.
  typecheck:
    name: Type check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check library and tests
        run: pnpm run typecheck

  # 5. Unit tests with the 90% coverage gate, on both current LTS lines.
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '20'
          - '22'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Write coverage summary to the job summary
        run: node -e "const total = require('./coverage/coverage-summary.json').total; const pct = (key) => total[key].pct + '%'; const line = 'Lines ' + pct('lines') + ' | Statements ' + pct('statements') + ' | Functions ' + pct('functions') + ' | Branches ' + pct('branches'); require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\n'); console.log(line);"

  # 6. Build the publishable package and verify the tarball contents.
  build:
    name: Build and package
    needs: [format, lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm run build

      - name: Show build output
        run: ls -la dist

      - name: Verify the publish tarball
        run: npm pack --dry-run

  # 7. Publish to npm when a version tag is pushed from main (requires NPM_TOKEN).
  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, format, lint, typecheck, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@codewithrajat/rm-toast-notification
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js with the npm registry
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Build the library
        run: pnpm run build

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
